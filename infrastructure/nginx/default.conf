# nginx reverse proxy for the portfolio CMS.
# All requests are forwarded to the gunicorn-served Flask backend, which also
# serves /static and /uploads itself.

upstream portfolio_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # Must match Flask's MAX_CONTENT_LENGTH (16 MB) so uploads aren't rejected
    # by the proxy before reaching the app.
    client_max_body_size 16m;

    location / {
        proxy_pass http://portfolio_backend;
        # $http_host keeps the port (e.g. localhost:8080) so Flask redirects
        # don't strip it and send the browser to the wrong port.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
